<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lời nhắn gửi tới bạn Nam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef7f6;
      --card: #ffffff;
      --card-hover: #f4fbfa;
      --text: #182726;
      --text-muted: #5c706e;
      --border: rgba(13, 148, 136, 0.14);
      --accent: #0d9488;
      --accent-soft: rgba(13, 148, 136, 0.1);
      --accent-hover: #0f766e;
      --danger: #ef4444;
      --shadow: 0 10px 30px -10px rgba(13, 74, 70, 0.12);
      --input-bg: #f8fcfb;
    }

    [data-theme="dark"] {
      --bg: #0f1d1c;
      --card: #162423;
      --card-hover: #1c2e2c;
      --text: #eef6f5;
      --text-muted: #93aba8;
      --border: rgba(45, 212, 191, 0.14);
      --accent: #14b8a6;
      --accent-soft: rgba(20, 184, 166, 0.14);
      --accent-hover: #0d9488;
      --danger: #f87171;
      --shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.45);
      --input-bg: #111c1b;
    }

    * { box-sizing: border-box; transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease; }

    body {
      margin: 0;
      padding: 28px 16px 48px;
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .wrapper {
      max-width: 640px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }

    .theme-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .theme-btn:hover { transform: translateY(-1px); border-color: var(--accent); }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 26px 28px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .header-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 8px;
      background: linear-gradient(90deg, #0d9488, #2dd4bf);
    }

    .title {
      margin: 6px 0 12px;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      letter-spacing: -0.3px;
    }

    .title span { color: var(--accent); font-weight: 400; opacity: 0.7; }

    .desc {
      margin: 0 0 18px;
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--text-muted);
      text-align: center;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    .anon-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .required-note { color: var(--danger); font-weight: 500; }

    .q-title {
      font-size: 15.5px;
      font-weight: 600;
      margin: 0 0 16px;
    }

    .q-title span { color: var(--danger); }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 15px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--input-bg);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-item:hover { background: var(--card-hover); border-color: var(--accent); }

    .option-item input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      min-width: 20px;
      margin-top: 1px;
      border: 2px solid var(--text-muted);
      border-radius: 50%;
      position: relative;
      cursor: pointer;
    }

    .option-item input[type="radio"]:checked {
      border-color: var(--accent);
    }

    .option-item input[type="radio"]:checked::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }

    .option-item:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .option-text {
      font-size: 14.5px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-family: inherit;
      font-size: 14.5px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .word-count {
      margin-top: 8px;
      text-align: right;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      gap: 12px;
    }

    .btn-submit {
      padding: 12px 32px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(13, 148, 136, 0.3);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-submit:hover { transform: translateY(-1px); opacity: 0.95; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-clear {
      background: transparent;
      border: none;
      color: var(--accent);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 10px;
    }

    .btn-clear:hover { background: var(--accent-soft); }

    #toast {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    #toast.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    #toast.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <button type="button" class="theme-btn" id="themeToggle">
        <span id="themeIcon">☀️</span>
        <span id="themeText">Chế độ sáng</span>
      </button>
    </div>

    <form id="cfsForm">
      <div class="card header-card">
        <h1 class="title"><span>——</span> lời nhắn gửi tới bạn Nam <span>——</span></h1>
        <p class="desc">
          Chào mọi người,các lời nhắn của mọi người sẽ được gửi ẩn danh tơi bạn Nam❤️❤️
        </p>
        <div class="meta-row">
          <span class="anon-badge">🔒 Gửi ẩn danh hoàn toàn</span>
          <span class="required-note">* Biểu thị câu hỏi bắt buộc</span>
        </div>
      </div>

      <div class="card">
        <p class="q-title">Nội dung cfs của bạn: <span>*</span></p>
        <div class="options">
          <label class="option-item">
            <input type="radio" name="category" value="Thường" required>
            <span class="option-text">lời nhắn</span>
          </label>
        </div>
      </div>

      <div class="card">
        <p class="q-title">Nhắn gửi tâm tư: <span>*</span></p>
        <textarea id="message" placeholder="Câu trả lời của bạn..." required></textarea>
        <div class="word-count" id="wordCount">0 từ</div>
      </div>

      <div class="actions">
        <button type="submit" class="btn-submit" id="submitBtn">Gửi</button>
        <button type="button" class="btn-clear" id="clearBtn">Xóa hết câu trả lời</button>
      </div>

      <div id="toast"></div>
    </form>
  </div>

  <script>
    const SCRIPT_URL = "DÁN_URL_APPS_SCRIPT_VÀO_ĐÂY";

    // Xử lý chuyển đổi Sáng / Tối
    const html = document.documentElement;
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const themeText = document.getElementById("themeText");

    function applyTheme(theme) {
      html.setAttribute("data-theme", theme);
      localStorage.setItem("cfs-theme", theme);
      themeIcon.textContent = theme === "dark" ? "☀️" : "🌙";
      themeText.textContent = theme === "dark" ? "Chế độ sáng" : "Chế độ tối";
    }

    const savedTheme = localStorage.getItem("cfs-theme") || "dark";
    applyTheme(savedTheme);

    themeToggle.addEventListener("click", () => {
      const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
    });

    // Đếm số từ
    const msgInput = document.getElementById("message");
    const wordCount = document.getElementById("wordCount");
    msgInput.addEventListener("input", () => {
      const words = msgInput.value.trim() ? msgInput.value.trim().split(/\s+/).length : 0;
      wordCount.textContent = `${words} từ`;
    });

    // Xóa hết câu trả lời
    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("cfsForm").reset();
      wordCount.textContent = "0 từ";
      document.getElementById("toast").className = "";
    });

    // Gửi bài
    document.getElementById("cfsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const toast = document.getElementById("toast");
      const selectedCat = document.querySelector('input[name="category"]:checked');

      btn.disabled = true;
      btn.textContent = "Đang gửi...";
      toast.className = "";

      const payload = {
        category: selectedCat ? selectedCat.value : "Thường",
        message: msgInput.value.trim()
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        toast.textContent = "Đã gửi confession ẩn danh thành công! 💗";
        toast.className = "success";
        document.getElementById("cfsForm").reset();
        wordCount.textContent = "0 từ";
      } catch (err) {
        toast.textContent = "Không thể gửi lúc này, vui lòng thử lại.";
        toast.className = "error";
      } finally {
        btn.disabled = false;
        btn.textContent = "Gửi";
      }
    });
  </script>
</body>
</html>
